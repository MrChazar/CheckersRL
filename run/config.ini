[playing_args]
play_with = dqn
play_using_white = True
using_endgame_database = True

n_playout = 25

[model_args]
checkpoint = ../savedata/DQN_c_epoch2700_20260216_2311.pth.tar
; # ../savedata/DQN_rew_epoch4400_20260215_1453.pth.tar
; # ../savedata/DQN_1_epoch200_20260215_0009.pth.tar
; # ../savedata/DQN_1_epoch5450_20260201_2236.pth.tar
name = DQN_fnijg
; # use_gpu = False
; # cpu, cuda or mps
device = mps
l2_const = 1e-4
n_steps = 4

[training_args]
max_epoch = 20000
batch_size = 512
n_cores = 8
epochs = 10
check_freq = 100
n_eval_games = 10

learn_rate = 0.0001
gamma = 0.97
epsilon_start = 1
epsilon_end = 0.01
; # was 1000 in the one with fastest falling eps
epsilon_decay = 1500
buffer_size = 100000
target_update_freq = 20