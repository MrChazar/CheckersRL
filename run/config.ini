[playing_args]
play_with = dqn
play_using_white = True
using_endgame_database = True
n_playout = 50

[model_args]
#checkpoint = ../savedata/DQN_test_epoch6000-13win
name = DQN_req_2
; # cpu, cuda or mps
device = cuda
l2_const = 1e-5
n_steps = 3
recursive_steps = 2

[training_args]
max_epoch = 1000
batch_size = 128
n_cores = 4
epochs = 20

learn_rate = 0.0007
gamma = 0.99
tau = 0.01
epsilon_start = 1
epsilon_end = 0.05
; # was 1000 in the one with fastest falling eps
epsilon_decay = 3000
buffer_size = 300000
starting_buffer_games = 400
beta_start = 0.4
beta_frames = 10000

[evaluation]
eval_freq = 100
n_eval_games = 10
# vvv używane w run_test
n_test_playout = 100
n_test_games = 1000
checkpoint_freq = 100
